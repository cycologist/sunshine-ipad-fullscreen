# ~/.config/systemd/user/plasma-kwin_wayland.service.d/50-sunshine-kmsgrab.conf
# Keep KWin from handing Sunshine kmsgrab buffers it cannot import (black picture
# with a working cursor). Requires a compositor restart: log out / back in.
[Service]
Environment=KWIN_DRM_USE_MODIFIERS=0
Environment=KWIN_DRM_PREFER_COLOR_DEPTH=8
